<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Coin Toss</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="./toss-favicon.png" >
</head>
<body>
    <div class="Toss-box">
        <h1>TOSS THE COIN IF YOU DARE</h1>
        <p class="description">Heads or Tails?</p>
        <p>Choose One</p>
        <button class="Coin-button"><img class="Coin-side-image" src="./HEADS.png" alt="Heads coin"/></button>
        <button class="Coin-button"><img class="Coin-side-image" src="./TAILS.png" alt="Heads coin"/></button>
    </div>
    <script src="index.js"></script>
</body>
</html>
